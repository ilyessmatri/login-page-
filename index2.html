<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="cat.jpg">
    <title>login page</title>
    <link rel="stylesheet" href="style.css">
    <script src="code.js" defer></script>
  </head>
  <body>
    <header>
      <h1>🎮 GAME LOGIN</h1>
      <p>Welcome back, player</p>
    </header>
    <main>
      <form id="loginForm" novalidate action="#" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required autocomplete="email">
        <br>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
        <br>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        <br>
        <p id="errorMessage"></p>
        <p id="successMessage"></p>
        <button id="loginButton" type="submit">LOGIN</button>
      </form>
      <aside class="news-panel">
        <h2>📰 News</h2>
        <ul>
          <li>New Pac-Man update</li>
          <li>Event this week</li>
          <li>Server maintenance</li>
        </ul>
      </aside>
    </main>
  </body>
</html>
